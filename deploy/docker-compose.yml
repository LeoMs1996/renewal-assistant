# 本地/演示环境一键起：应用 + Prometheus + OTel Collector
#
# 用法（在仓库根）：
#   docker compose -f deploy/docker-compose.yml up -d --build
#   curl -s localhost:8000/metrics | head
#   open http://localhost:9090/targets        # 抓取目标应为 UP
#   open http://localhost:9090/alerts
#
# 轨迹 → OTLP 导出（一次性 / 周期两种）：
#   docker compose -f deploy/docker-compose.yml run --rm trace-export
#
# 说明：
# - 生产不要用本文件（凭证走环境变量、无 TLS、无持久化）。生产见 k8s/。
# - traces 卷必须持久化：/trace 回放与 otel_export 都依赖它。
name: renewal-assistant

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: renewal-assistant:local
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      TRACE_DIR: /app/traces
      RENEWAL_ENV: dev
      # 演示模式：留空 = 无鉴权但响应头标 X-Auth-Mode: demo。
      # 生产必须配置：逗号分隔 key:owner_id（见 server/middleware.py）。
      RENEWAL_API_KEYS: ${RENEWAL_API_KEYS:-}
      RENEWAL_RATE_LIMIT_PER_MIN: "60"
      # LLM 凭证由外部注入，绝不写进镜像
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      MODEL_NAME: ${MODEL_NAME:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - traces:/app/traces
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).status==200 else 1)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    depends_on:
      - otel-collector
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.6.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.140.0
    ports:
      - "4317:4317"    # OTLP/gRPC
      - "4318:4318"    # OTLP/HTTP（otel_export 用的是这个）
      - "8888:8888"    # Collector 自监控
      - "13133:13133"  # health_check
    volumes:
      - ./otel/collector.yaml:/etc/otelcol/config.yaml:ro
    command: ["--config=/etc/otelcol/config.yaml"]
    restart: unless-stopped

  # 一次性把 traces/ 里已有的轨迹推给 collector（spanId 确定性，可重复执行）
  trace-export:
    image: renewal-assistant:local
    profiles: ["exporter"]
    depends_on:
      - otel-collector
    volumes:
      - traces:/app/traces
    environment:
      TRACE_DIR: /app/traces
    command: ["python", "-m", "server.otel_export",
              "--trace-dir", "/app/traces",
              "--endpoint", "http://otel-collector:4318",
              "--batch", "50"]
    restart: "no"

volumes:
  traces: {}
  prometheus-data: {}
